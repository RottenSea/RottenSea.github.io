# Checks the repository and deploys GitHub Pages, which at rottensea.github.io only sends readers on
# to rottenth.cafe: the home page to www.rottenth.cafe, and every other page of the personal website
# to the same path at article.rottenth.cafe, from scripts/pages-redirect.ts. The three sites themselves are built and deployed by
# Cloudflare Workers Builds. The steps follow https://docs.astro.build/en/guides/deploy/github/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run replaces an older queued one, but a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: each post's revision count and update date come from its commits.
          fetch-depth: 0
      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      # Runs Biome's format and lint checks over the whole repository, and type checks every site.
      - run: pnpm check
      # The personal website is built only for the list of its pages.
      - run: pnpm --filter article build
      - run: node scripts/pages-redirect.ts sites/article/dist pages-redirect
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
